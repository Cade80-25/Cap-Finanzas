appId: com.capfinanzas.app
productName: Cap Finanzas
# NOTA: NO sobreescribir artifactName. Los nombres por defecto de electron-builder
# producen los mismos archivos que ya están publicados en releases anteriores:
#   Windows (NSIS): "Cap.Finanzas.Setup.${version}.exe"
#   macOS  (DMG):   "Cap.Finanzas-${version}-${arch}.dmg"
#   Linux  (AppIm): "Cap.Finanzas-${version}.AppImage"
# La página /instalar depende de este patrón.
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json

publish:
  provider: github
  owner: Cade80-25
  repo: Cap-Finanzas

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon-final.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: public/icon-final.png
  category: public.app-category.finance
  # Allow running unsigned builds on macOS (users still see Gatekeeper warning)
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: public/icon-final.png
  category: Finance

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Cap Finanzas"
  installerIcon: public/icon-final.ico
  uninstallerIcon: public/icon-final.ico
  include: electron/installer.nsh
