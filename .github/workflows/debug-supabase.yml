name: debug-supabase-keepalive

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Cap-Finanzas endpoint
        env:
          KEY: ${{ secrets.SUPABASE_KEY_CAPFINANZAS }}
        run: |
          echo "Testing cap-finanzas-backend..."
          echo "Key length: ${#KEY}"
          echo "Key prefix: ${KEY:0:20}..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://vpxqgxehmealrwbwmicm.supabase.co/rest/v1/licenses?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || code=000
          echo "HTTP Code: $code"
          body=$(curl -s --max-time 30 \
            "https://vpxqgxehmealrwbwmicm.supabase.co/rest/v1/licenses?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || body="curl failed"
          echo "Response: $body"

      - name: Test Academia endpoint
        env:
          KEY: ${{ secrets.SUPABASE_KEY_ACADEMIA }}
        run: |
          echo "Testing academy-nova-backend..."
          echo "Key length: ${#KEY}"
          echo "Key prefix: ${KEY:0:20}..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://silgzccdbqjqkcwpmpao.supabase.co/rest/v1/email_send_log?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || code=000
          echo "HTTP Code: $code"
          body=$(curl -s --max-time 30 \
            "https://silgzccdbqjqkcwpmpao.supabase.co/rest/v1/email_send_log?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || body="curl failed"
          echo "Response: $body"

      - name: Test without auth (project health)
        run: |
          echo "Testing cap-finanzas without auth..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://vpxqgxehmealrwbwmicm.supabase.co/rest/v1/") || code=000
          echo "HTTP Code: $code"

          echo "Testing academia without auth..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://silgzccdbqjqkcwpmpao.supabase.co/rest/v1/") || code=000
          echo "HTTP Code: $code"

      - name: Test with CAPFINANZAS_ANON_KEY
        env:
          KEY: ${{ secrets.CAPFINANZAS_ANON_KEY }}
        run: |
          echo "Testing with CAPFINANZAS_ANON_KEY..."
          echo "Key length: ${#KEY}"
          echo "Key prefix: ${KEY:0:20}..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://vpxqgxehmealrwbwmicm.supabase.co/rest/v1/licenses?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || code=000
          echo "HTTP Code: $code"
          body=$(curl -s --max-time 30 \
            "https://vpxqgxehmealrwbwmicm.supabase.co/rest/v1/licenses?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || body="curl failed"
          echo "Response: $body"