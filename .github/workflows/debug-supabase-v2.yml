name: debug-supabase-keepalive-v2

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping cap-finanzas with verbose output
        env:
          KEY: ${{ secrets.SUPABASE_KEY_CAPFINANZAS }}
        run: |
          echo "=== cap-finanzas-backend ==="
          echo "Key length: ${#KEY}"
          echo "Key prefix: ${KEY:0:30}..."
          echo "Key suffix: ...${KEY: -30}"
          code=$(curl -s -w '%{http_code}' --max-time 30 \
            "https://vpxqgxehmealrwbwmicm.supabase.co/rest/v1/licenses?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Accept: application/json") || code=000
          echo "HTTP Code: $code"
          body=$(curl -s --max-time 30 \
            "https://vpxqgxehmealrwbwmicm.supabase.co/rest/v1/licenses?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Accept: application/json") || body="curl failed"
          echo "Response: $body"

      - name: Ping academia with verbose output
        env:
          KEY: ${{ secrets.SUPABASE_KEY_ACADEMIA }}
        run: |
          echo "=== academy-nova-backend ==="
          echo "Key length: ${#KEY}"
          echo "Key prefix: ${KEY:0:30}..."
          echo "Key suffix: ...${KEY: -30}"
          code=$(curl -s -w '%{http_code}' --max-time 30 \
            "https://silgzccdbqjqkcwpmpao.supabase.co/rest/v1/email_send_log?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Accept: application/json") || code=000
          echo "HTTP Code: $code"
          body=$(curl -s --max-time 30 \
            "https://silgzccdbqjqkcwpmpao.supabase.co/rest/v1/email_send_log?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Accept: application/json") || body="curl failed"
          echo "Response: $body"