name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Se ejecuta al crear un tag como v1.0.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ El tag (v${TAG_VERSION}) no coincide con package.json (${PKG_VERSION})."
            exit 1
          fi

      - name: Build Vite app
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: vpxqgxehmealrwbwmicm
          VITE_SUPABASE_URL: https://vpxqgxehmealrwbwmicm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZweHFneGVobWVhbHJ3YndtaWNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTk2NzgsImV4cCI6MjEwNTU5NTY3OH0.zF_KC2W_HUaRa1XUKvToOPZSPsa5WzfcFD0zwg6Xqw8"

      # --publish always uploads installers AND latest*.yml feed files to the GitHub release
      - name: Build & publish Electron (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish Electron (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build & publish Electron (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los binarios se publican en el GitHub Release (paso anterior).
      # El Worker "capfinanzas-downloads" los sirve desde ahi con un token
      # secreto, asi el repo puede ser PRIVADO y el cliente no necesita cuenta.
      # No hace falta subir nada a ningun otro lado: el Worker siempre toma
      # el ultimo release, asi que el enlace publico nunca se rompe.
      - name: Verificar que el release quedo publicado
        shell: bash
        run: |
          echo "Binarios publicados en el release ${{ github.ref_name }}"
          echo "El Worker los servira automaticamente desde:"
          echo "  https://capfinanzas-downloads.capfinanzas.workers.dev"

      # Backup: also keep build artifacts in the workflow run for debugging
      # (DESACTIVADO 2026-10-09: la cuota de artifacts del repo esta saturada por
      #  60+ versiones; los instaladores viven en el GitHub Release, no aca)
      # - name: Upload artifacts (debug)
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: release-${{ matrix.platform }}
      #     path: |
      #       release/*.exe
      #       release/*.dmg
      #       release/*.zip
      #       release/*.AppImage
      #       release/*.deb
      #       release/*.yml
      #       release/*.blockmap
      #     if-no-files-found: ignore
