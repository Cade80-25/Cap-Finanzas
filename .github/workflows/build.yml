name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Se ejecuta al crear un tag como v1.0.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ El tag (v${TAG_VERSION}) no coincide con package.json (${PKG_VERSION})."
            exit 1
          fi

      - name: Build Vite app
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: pcxvnqsoafagnthazoir
          VITE_SUPABASE_URL: https://pcxvnqsoafagnthazoir.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjeHZucXNvYWZhZ250aGF6b2lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDkxMTUsImV4cCI6MjA4NTI4NTExNX0.KHQfeM-Jfv1hp8mKZSKXM9gFbCC9AlrgGx68Ee7JJzo"

      # --publish always uploads installers AND latest*.yml feed files to the GitHub release
      - name: Build & publish Electron (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish Electron (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build & publish Electron (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Backup: also keep build artifacts in the workflow run for debugging
      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore
