name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Se ejecuta al crear un tag como v1.0.0

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: ${TAG_VERSION} | package.json: ${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ El tag (v${TAG_VERSION}) no coincide con package.json (${PKG_VERSION})."
            exit 1
          fi

      - name: Build Vite app
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: vpxqgxehmealrwbwmicm
          VITE_SUPABASE_URL: https://vpxqgxehmealrwbwmicm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZweHFneGVobWVhbHJ3YndtaWNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTk2NzgsImV4cCI6MjEwNTU5NTY3OH0.zF_KC2W_HUaRa1XUKvToOPZSPsa5WzfcFD0zwg6Xqw8"

      # --publish always uploads installers AND latest*.yml feed files to the GitHub release
      - name: Build & publish Electron (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish Electron (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build & publish Electron (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Subida automatica a Cloudflare R2 con nombres FIJOS (sin version).
      # Asi el enlace publico (downloads.capfinanzas.com/Cap-Finanzas-Setup.exe)
      # nunca se rompe al publicar una version nueva.
      - name: Subir binario a Cloudflare R2
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::R2 no configurado (faltan secrets). Se omite la subida."
            exit 0
          fi
          npm install --no-save @aws-sdk/client-s3

          # Nombre destino segun plataforma (fijo, sin version)
          case "${{ matrix.platform }}" in
            win)   SRC=$(ls release/*.exe | head -n1);   DST="Cap-Finanzas-Setup.exe" ;;
            mac)   SRC=$(ls release/*-arm64.dmg 2>/dev/null | head -n1 || ls release/*.dmg | head -n1); DST="Cap-Finanzas-arm64.dmg" ;;
            linux) SRC=$(ls release/*.AppImage | head -n1); DST="Cap-Finanzas.AppImage" ;;
          esac
          echo "Subiendo $SRC -> $DST"
          node -e "
            const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
            const fs = require('fs');
            const s3 = new S3Client({
              region: 'auto',
              endpoint: process.env.R2_ENDPOINT,
              credentials: {
                accessKeyId: process.env.R2_ACCESS_KEY_ID,
                secretAccessKey: process.env.R2_SECRET_ACCESS_KEY,
              },
            });
            const file = process.argv[1], key = process.argv[2];
            s3.send(new PutObjectCommand({
              Bucket: process.env.R2_BUCKET,
              Key: key,
              Body: fs.createReadStream(file),
              ContentType: 'application/octet-stream',
            })).then(() => console.log('OK -> ' + key))
              .catch(e => { console.error(e); process.exit(1); });
          " "$SRC" "$DST"

      # Backup: also keep build artifacts in the workflow run for debugging
      - name: Upload artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: ignore
